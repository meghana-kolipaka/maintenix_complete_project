{% extends "base.html" %}
{% block title %}Requests | Maintenix{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">WORKSPACE</p><h1>Maintenance requests</h1><p class="muted">Track, search and manage reported issues.</p></div>
<a class="btn primary" href="{% url 'report_issue' %}">＋ New request</a></div>
<form method="get" class="filter-bar">
  <input type="search" name="q" placeholder="Search requests..." value="{{ query }}">
  <select name="status">
    <option value="">All statuses</option>
    <option value="pending" {% if status == "pending" %}selected{% endif %}>Pending</option>
    <option value="assigned" {% if status == "assigned" %}selected{% endif %}>Assigned</option>
    <option value="in_progress" {% if status == "in_progress" %}selected{% endif %}>In Progress</option>
    <option value="resolved" {% if status == "resolved" %}selected{% endif %}>Resolved</option>
    <option value="rejected" {% if status == "rejected" %}selected{% endif %}>Rejected</option>
  </select>
  <button class="btn secondary" type="submit">Filter</button>
  <a class="clear-link" href="{% url 'request_list' %}">Clear</a>
</form>
{% include "core/request_table.html" with requests=requests %}
{% endblock %}
